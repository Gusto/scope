apiVersion: scope.github.com/v1alpha
kind: ScopeDoctorGroup
metadata:
  name: default-group
  description: Runs automatically
spec:
  actions:
    - name: file-exists
      check:
        commands:
          - test -f {{ working_dir }}/file-mod.txt
      fix:
        commands:
          - touch {{ working_dir }}/file-mod.txt
