apiVersion: scope.github.com/v1alpha
kind: ScopeKnownError
metadata:
  name: missing-status-file
  description: Detects when status.txt is missing and creates it
spec:
  pattern: "status.txt: No such file"
  help: The status.txt file is missing.
  fix:
    prompt:
      text: "Create the status.txt file?"
    commands:
      - bash -c 'echo "ready" > status.txt'
