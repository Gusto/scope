version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      opentelemetry:
        applies-to: version-updates
        patterns:
          - "opentelemetry*"
      prod-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "opentelemetry*"
